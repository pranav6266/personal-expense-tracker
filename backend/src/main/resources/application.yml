server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-api
  profiles:
    # postgres-db uses the JPA-backed ExpenseServiceImpl
    active: ${SPRING_PROFILES_ACTIVE:postgres-db}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USERNAME:expense_user}
    password: ${DB_PASSWORD:expense_password}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Comma-separated origin patterns allowed to call the API from a browser
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  # Base64-encoded HS256 key (32+ bytes). If unset, a random key is generated at startup
  # and all tokens become invalid on restart.
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:36000000}
  # The admin account is only seeded when ADMIN_PASSWORD is set
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
