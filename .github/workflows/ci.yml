name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test bootJar --no-daemon

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew compileJava --no-daemon

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyEh
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through the web proxy
        run: |
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/api/actuator/health | grep -q '"UP"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
